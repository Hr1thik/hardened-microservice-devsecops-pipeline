# SOPS-encrypted secret file example (safe for Git)
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: default
type: Opaque
stringData:
  DB_USER: ENC[AES256_GCM,data:Y211cw==,iv:1A2B3C...,tag:XYZ...]
  DB_PASSWORD: ENC[AES256_GCM,data:c3VwZXJzZWNyZXQ=,iv:4D5E6F...,tag:ABC...]
sops:
  kms:
    - arn: arn:aws:kms:us-east-1:123456789012:key/12345678-1234-1234-1234-123456789012
      created_at: "2026-08-12T12:00:00Z"
      enc: "AQICAHg1..."
  version: 3.8.1